<!doctype html><meta charset="utf-8"><style>@font-face{font-family:Jakarta;src:url('jakarta.woff2');font-weight:200 800}*{margin:0}body{background:#f4f1fb}canvas{display:block}</style><canvas id="c"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),W=1080;let H=1920,Y=290;const photo=new Image();photo.src='florist.png';const happy=new Image();happy.src='happy-owner.png';
const violet='#6B4EE6',ink='#14243A',cream='#FAF8F4';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>1-Math.pow(1-clamp(v),3),lerp=(a,b,p)=>a+(b-a)*p;
function rr(x,y,w,h,r=22,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function text(s,x,y,size=40,color=ink,weight=700,align='left',family='Jakarta'){g.fillStyle=color;g.font=`${weight} ${size}px ${family}`;g.textAlign=align;g.fillText(s,x,y)}
function photoFill(x,y,w,h,zoom=1,anchor=.5,img=photo){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();let sc=Math.max(w/img.width,h/img.height)*zoom;g.drawImage(img,x+(w-img.width*sc)/2,y+(h-img.height*sc)*anchor,img.width*sc,img.height*sc);g.restore()}
function shadow(on=true){g.shadowColor=on?'rgba(25,20,55,.17)':'transparent';g.shadowBlur=on?55:0;g.shadowOffsetY=on?22:0}
function brand(y=Y,color=ink,large=false){const x=100,k=large?1.35:1;rr(x,y,58*k,58*k,16*k,violet);text('w',x+29*k,y+42*k,44*k,'#fff',800,'center');text('webtummy',x+75*k,y+43*k,39*k,color,800)}
function bg(dark=false,t=0){g.fillStyle=dark?'#17142F':cream;g.fillRect(0,0,W,H);let gr=g.createRadialGradient(940,450,30,840,650,1100);gr.addColorStop(0,dark?'#514099':'#E8E1FF');gr.addColorStop(1,dark?'#17142F':cream);g.fillStyle=gr;g.fillRect(0,0,W,H);g.save();g.globalAlpha=.35;g.strokeStyle=dark?'#8C79DA':'#CEC0F3';g.lineWidth=2;for(let i=0;i<4;i++){g.beginPath();g.ellipse(1100,1350-i*60,900+i*90,400+i*100,-.5,0,Math.PI*2);g.stroke()}g.restore()}
function enter(t,start=0,dist=45){return dist*(1-ease((t-start)/.65))}
function heading(lines,y,t,color=ink,size=82){lines.forEach((line,i)=>{g.save();g.globalAlpha=ease((t-i*.12)/.55);text(line,100,y+i*(size*1.18)+enter(t,i*.12),size,color,800);g.restore()})}
function pill(s,x,y,w,fill=violet,color='white',size=25){rr(x,y,w,58,29,fill);text(s,x+w/2,y+38,size,color,700,'center')}
function sparkle(x,y,s=20,color=violet){g.save();g.translate(x,y);g.fillStyle=color;g.beginPath();g.moveTo(0,-s);g.quadraticCurveTo(s*.15,-s*.15,s,0);g.quadraticCurveTo(s*.15,s*.15,0,s);g.quadraticCurveTo(-s*.15,s*.15,-s,0);g.quadraticCurveTo(-s*.15,-s*.15,0,-s);g.fill();g.restore()}
function website(x,y,w,h,t=0,mobile=false){g.save();shadow();rr(x,y,w,h,22,'white');shadow(false);g.beginPath();g.roundRect(x,y,w,h,22);g.clip();const scale=w/(mobile?320:900);g.translate(x,y);g.scale(scale,scale);let ww=w/scale,hh=h/scale;
rr(0,0,ww,44,0,'#F0EFF0');[0,1,2].forEach((a)=>rr(18+a*15,18,7,7,4,['#F1958E','#EFCB81','#9ACBAA'][a]));rr(ww*.28,12,ww*.45,21,8,'#FFFFFF');text('yourbusiness.example',ww*.5,27,11,'#8E9491',500,'center');
g.fillStyle='#F9F7F1';g.fillRect(0,44,ww,hh-44);text('Your business',mobile?21:40,mobile?88:105,mobile?22:31,'#253E32',600,'left','Georgia');if(!mobile){text('OUR STORY',500,100,12,'#526058',600);text('FLOWERS',620,100,12,'#526058',600);rr(735,75,127,40,20,'#314E3B');text('Get in touch',798,101,12,'white',600,'center')}
if(mobile){photoFill(0,118,ww,300,1.08,.58);text('Beautiful blooms.',22,469,33,'#253E32',500,'left','Georgia');text('Made personal.',22,509,33,'#253E32',500,'left','Georgia');text('Thoughtfully arranged, just for you.',22,552,11,'#677369',500);rr(22,575,177,39,20,'#314E3B');text('Explore the collection',111,600,11,'white',600,'center')}
else {photoFill(475,145,425,hh-145,1.15,.6);text('Flowers for',43,240,58,'#253E32',500,'left','Georgia');text('your everyday',43,309,58,'#253E32',500,'left','Georgia');text('and always.',43,378,58,'#253E32',500,'left','Georgia');text('Thoughtful arrangements. Beautiful moments.',45,432,15,'#677369',500);rr(44,468,224,53,27,'#314E3B');text('Explore the collection',156,502,16,'white',600,'center');text('LOCAL FLOWERS. PERSONAL TOUCH.',44,hh-35,12,'#778276',600)}
g.restore()}
function scene0(t){bg(false,t);photoFill(0,H*.30,W,H*.70,1.03+t*.015,.48,happy);let grad=g.createLinearGradient(0,Y+290,0,H*.65);grad.addColorStop(0,cream);grad.addColorStop(.28,'rgba(250,248,244,.94)');grad.addColorStop(1,'rgba(250,248,244,0)');g.fillStyle=grad;g.fillRect(0,0,W,H);brand();heading(['Big plans.','Less hassle.'],Y+190,t,ink,94);g.save();g.globalAlpha=ease((t-.7)/.6);text('Your website journey starts here.',104,Y+440+enter(t,.7,20),36,'#635A73',500);g.restore();pill('START WITH 7 DAYS FREE',100,Y+510,600,'#fff',violet,23)}
function scene1(t){bg(true,t);brand(Y,'white');heading(['No hassle.','Hosting included.'],Y+190,t,'#fff',86);text('No separate hosting to set up.',103,Y+395,30,'#C8C0E0',500);const cards=[['DESIGN','AI-assisted website creation.','#C9B9FF'],['EDIT','Make every detail yours.','#BFE2D7'],['HOST','All together. In one place.','#F1C9AF']];cards.forEach((v,i)=>{let p=ease((t-.35-i*.2)/.7);g.save();g.translate(100+(1-p)*160,Y+465+i*126);g.globalAlpha=p;rr(0,0,880,106,24,'rgba(255,255,255,.07)','rgba(255,255,255,.13)');rr(22,24,58,58,16,v[2]);sparkle(51,53,15,'#3E2C68');text(v[0],108,43,18,v[2],800);text(v[1],108,79,30,'white',600);text('↗',824,70,37,v[2],600);g.restore()});sparkle(930,Y+150,20,'#CCBBFF')}
function scene2(t){bg(false,t);brand();heading(['Your vision.','A starting point.'],Y+190,t,ink,80);let p=ease((t-.2)/.65);g.save();g.globalAlpha=p;g.translate(0,30*(1-p));shadow();rr(100,Y+385,880,240,30,'white');shadow(false);text('WHAT WOULD YOU LIKE TO CREATE?',137,Y+433,18,'#978BA7',800);const prompt='A beautiful website for my flower studio.';let count=Math.floor(clamp((t-.5)/1.7)*prompt.length);text(prompt.slice(0,Math.min(count,27)),137,Y+489,31,ink,600);if(count>27)text(prompt.slice(27,count),137,Y+535,31,ink,600);pill('Create my website  ↗',530,Y+550,410,violet,'white',25);g.restore();let q=ease((t-2.1)/.8);g.save();g.globalAlpha=q;g.translate(0,(1-q)*160);website(150,Y+690,780,510,t);g.restore();sparkle(960,Y+687+Math.sin(t*2)*7,26,violet)}
function scene3(t){bg(false,t);brand();heading(['Create. Edit.','Make it yours.'],Y+180,t,ink,83);text('Shape every detail to fit your business.',104,Y+380,30,'#6D6678',500);g.save();g.translate(0,enter(t,.1,85));website(85,Y+470,910,610,t);const q=ease((t-.6)/.65);g.save();g.globalAlpha=q;rr(70,Y+887,560,120,23,'white','#E8E1F3');text('Make it feel like you.',100,Y+929,24,ink,700);[violet,'#314E3B','#C18A67','#D8C5A5'].forEach((col,i)=>{rr(101+i*52,Y+950,34,34,17,col);if(i===1){g.strokeStyle=ink;g.lineWidth=2;g.beginPath();g.arc(118+i*52,Y+967,22,0,Math.PI*2);g.stroke()}});g.restore();g.restore();text('Illustrative website preview',540,Y+1130,18,'#8D8496',500,'center')}
function scene4(t){bg(false,t);photoFill(0,H*.27,W,H*.73,1.05+t*.02,.48,happy);let grad=g.createLinearGradient(0,Y+250,0,Y+700);grad.addColorStop(0,cream);grad.addColorStop(.5,'rgba(250,248,244,.85)');grad.addColorStop(1,'rgba(250,248,244,0)');g.fillStyle=grad;g.fillRect(0,0,W,H);brand();heading(['Back to what','you love.'],Y+185,t,ink,89);text('Create your website. Keep doing your thing.',103,Y+400,30,'#635A73',500);g.save();g.globalAlpha=ease((t-.5)/.6);pill('NO SEPARATE HOSTING TO SET UP',100,Y+465,850,'white',violet,25);g.restore()}
function scene5(t){bg(false,t);brand(Y,ink,true);heading(['Your website.','Made simple.'],Y+210,t,ink,84);g.save();g.globalAlpha=ease((t-.25)/.6);text('7 days free.',100,Y+470+enter(t,.25),112,violet,800);g.restore();text('No hassle. Hosting included.',105,Y+555,32,'#6D6678',600);g.save();g.globalAlpha=ease((t-.5)/.5);shadow();rr(100,Y+625,880,116,29,violet);shadow(false);text('Start your free trial',153,Y+698,39,'white',800);text('↗',900,Y+699,48,'white',600,'center');text('webtummy.com',540,Y+825,41,ink,800,'center');text('Card required. Paid subscription follows',540,Y+895,24,'#756B80',500,'center');text('unless cancelled before the trial ends.',540,Y+929,24,'#756B80',500,'center');g.restore();sparkle(950,Y+470+Math.sin(t*2)*8,23,violet)}
const starts=[0,3,6,10,13,16],ends=[3,6,10,13,16,20],scenes=[scene0,scene1,scene2,scene3,scene4,scene5];
window.ready=Promise.all([document.fonts.load('800 90px Jakarta'),document.fonts.load('500 30px Jakarta'),photo.decode(),happy.decode()]);
window.render=(time,height=1920)=>{H=height;Y=height===1920?290:90;c.width=W;c.height=H;g.clearRect(0,0,W,H);let idx=starts.findLastIndex(v=>time>=v);idx=Math.max(0,idx);scenes[idx](time-starts[idx]);if(idx>0&&time-starts[idx]<.28){g.save();g.globalAlpha=1-ease((time-starts[idx])/.28);scenes[idx-1](ends[idx-1]-starts[idx-1]);g.restore()}g.fillStyle=idx===1||idx===4?'rgba(255,255,255,.2)':'rgba(107,78,230,.12)';g.fillRect(0,H-8,W,8);g.fillStyle=violet;g.fillRect(0,H-8,W*clamp(time/20),8)};
</script>
