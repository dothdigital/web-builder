server {
    listen 80;
    listen [::]:80;
    server_name webtummy.com www.webtummy.com;
    access_log /var/log/nginx/webtummy-app.access.log;
    error_log /var/log/nginx/webtummy-app.error.log;
    server_tokens off;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /.well-known/acme-challenge/ { root /var/www/webtummy-acme; }
    location / { include /etc/nginx/snippets/webtummy-proxy.conf; }
}

server {
    listen 80;
    listen [::]:80;
    server_name build.webtummy.com;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/build.webtummy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build.webtummy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/webtummy-builder.access.log;
    error_log /var/log/nginx/webtummy-builder.error.log;
    server_tokens off;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /.well-known/acme-challenge/ { root /var/www/webtummy-acme; }
    location / {
        if ($scheme = http) { return 301 https://build.webtummy.com$request_uri; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
