server {
    listen 80;
    listen [::]:80;
    server_name webtummy.com www.webtummy.com build.webtummy.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/webtummy-acme; }
    location / { return 301 https://webtummy.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webtummy.com;
    ssl_certificate /etc/letsencrypt/live/webtummy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtummy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 25m;
    access_log /var/log/nginx/webtummy-app.access.log;
    error_log /var/log/nginx/webtummy-app.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/snippets/webtummy-static.conf;
    location / { include /etc/nginx/snippets/webtummy-proxy.conf; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.webtummy.com;
    ssl_certificate /etc/letsencrypt/live/webtummy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtummy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 301 https://webtummy.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name build.webtummy.com;
    ssl_certificate /etc/letsencrypt/live/build.webtummy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build.webtummy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 301 https://webtummy.com$request_uri;
}
